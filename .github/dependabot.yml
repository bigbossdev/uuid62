version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Jest packages must move together (jest, @types/jest, ts-jest)
      jest:
        patterns: ["jest", "@types/jest", "ts-jest"]
      dev-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ts-jest's peer range is typescript <7 — upgrade manually once supported
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node types on the oldest maintained line we target, not the newest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
